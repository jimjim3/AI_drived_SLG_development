[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slg"
version = "0.1.0"
description = "Open-source browser Three Kingdoms strategy game where LLM agents play the rulers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yhho3.winbond" }]
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slg = ["narrative/data/**/*.json"]
